-size="12" fill="#6b7891">Medium ▾</text><text x="272" y="387" font-size="13" font-weight="700" fill="#52617e">DESCRIPTION</text><rect x="272" y="400" width="635" height="84" rx="7" fill="#fbfcff" stroke="#dce4f0"/><text x="288" y="425" font-size="12" fill="#9aa6bd">Describe the issue and include relevant details...</text><rect x="802" y="501" width="105" height="31" rx="7" fill="url(#a)"/><text x="854" y="521" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">Submit ticket</text></g></g><text x="500" y="620" font-family="Segoe UI,Arial" font-size="13" fill="#c1d2f3" text-anchor="middle">Overview  •  Tickets  •  Team &amp; Access  •  Create Ticket</text><circle cx="420" cy="610" r="4" fill="#59d8ff"><animate attributeName="opacity" values="1;.25;1" dur="4s" repeatCount="indefinite"/></circle><circle cx="442" cy="610" r="4" fill="#a58aff"><animate attributeName="opacity" values=".25;1;.25" dur="4s" repeatCount="indefinite"/></circle></svg>