<text x="315" y="111" font-family="Segoe UI,Arial,sans-serif" font-size="60" font-weight="800" letter-spacing="2" fill="url(#glow)">ORBITDESK</text><text x="318" y="155" font-family="Segoe UI,Arial,sans-serif" font-size="27" font-weight="700" fill="#fff">HELP DESK &amp; TICKETING SYSTEM</text><text x="320" y="194" font-family="Segoe UI,Arial,sans-serif" font-size="19" fill="#b9dfff">Simplify support. Streamline communication. Deliver better experiences.</text><path d="M315 214 C500 230 760 228 937 205" fill="none" stroke="url(#glow)" stroke-width="2" stroke-linecap="round" stroke-dasharray="7 10"><animate attributeName="stroke-dashoffset" values="0;-68" dur="4s" repeatCount="indefinite"/></path></svg>