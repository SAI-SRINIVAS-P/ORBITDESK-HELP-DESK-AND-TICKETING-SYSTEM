name: CI
on:
  push:
  pull_request:
jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: 10.0.x }
      - run: dotnet restore backend/HelpDesk.sln
      - run: dotnet test backend/HelpDesk.sln --configuration Release --no-restore
  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - working-directory: frontend
        run: npm install
      - working-directory: frontend
        run: npm run build
